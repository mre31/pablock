name: Linux checks and packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      CARGO_BUILD_JOBS: 3
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2
          npm install -g pnpm@11.9.0
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Rust checks
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Frontend checks
        run: |
          pnpm lint
          pnpm test
          pnpm build
      - name: Build executable and packages
        run: |
          pnpm tauri build --no-bundle
          pnpm tauri bundle
      - uses: actions/upload-artifact@v4
        with:
          name: pablock-linux-x86_64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
